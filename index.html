<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPTEL Cybersecurity MCQ Practice</title>
    <meta name="description" content="A focused, completely stateless practice platform for NPTEL Cybersecurity questions stored directly as repository JSON files, featuring Practice Mode, Exam Mode, and bulk question import with JSON export." />
    <meta property="og:title" content="NPTEL Cybersecurity MCQ Practice" />
    <meta property="og:description" content="A focused, completely stateless practice platform for NPTEL Cybersecurity questions stored directly as repository JSON files, featuring Practice Mode, Exam Mode, and bulk question import with JSON export." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Ignore WebSocket / Vite HMR connection errors in iframe environment
      window.addEventListener('error', function(e) {
        if (
          e.message &&
          (e.message.includes('WebSocket') ||
           e.message.includes('createWebSocketModuleRunnerTransport') ||
           (e.filename && e.filename.includes('@vite/client')))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason ? String(e.reason.stack || e.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      // Initialize theme class immediately
      (function() {
        try {
          var saved = localStorage.getItem('app_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
